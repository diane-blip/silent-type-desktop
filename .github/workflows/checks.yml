name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked CPU runtime
        run: python -m pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-cpu.lock
      - name: Install locked development tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Package consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Offline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Audit CPU runtime
        run: python -m pip_audit -r requirements-cpu.lock --disable-pip --no-deps
      - name: Audit CUDA runtime
        run: python -m pip_audit -r requirements-cuda.lock --disable-pip --no-deps
      - name: Audit base PyTorch version
        run: |
          Set-Content -Path torch-audit.txt -Value 'torch==2.13.0'
          python -m pip_audit -r torch-audit.txt --disable-pip --no-deps
