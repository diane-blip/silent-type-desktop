[project]
name = "silent-type"
version = "0.4.1"
description = "Type by mouthing the words: webcam lip reading that types at your cursor on Windows"
requires-python = ">=3.12,<3.13"
license = "MIT"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["vendor", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E731"]
